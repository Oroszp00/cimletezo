<!DOCTYPE html>
<html lang="hu" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forint Címletező & Kasszaelosztó</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        /* Hide number input spinners */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-white pb-6">

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-4 right-4 left-4 sm:left-auto z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-800 text-white px-4 py-2.5 rounded-xl shadow-2xl border border-slate-700 flex items-center justify-between sm:justify-start gap-3 pointer-events-none text-xs sm:text-sm">
        <div class="flex items-center gap-2">
            <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
            <span id="toast-message" class="font-medium">Értesítés</span>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <div class="container mx-auto px-2 sm:px-4 py-3 max-w-5xl">
        
        <!-- COMPACT HEADER -->
        <header class="mb-4 flex flex-wrap items-center justify-between gap-2 border-b border-slate-800 pb-3">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center shadow-md">
                    <i class="fa-solid fa-money-bill-wave text-slate-950 text-sm font-bold"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold tracking-tight text-white flex items-center gap-1.5 leading-tight">
                        Forint Címletező
                        <span class="text-[10px] font-semibold uppercase px-1.5 py-0.2 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">HUF</span>
                    </h1>
                </div>
            </div>

            <!-- Quick Action Toolbar -->
            <div class="flex items-center gap-1.5">
                <button id="btn-copy-summary" title="Összegzés másolása" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium px-2.5 py-1.5 rounded-lg border border-slate-700 transition flex items-center gap-1.5 active:scale-95">
                    <i class="fa-solid fa-copy text-teal-400"></i>
                    <span class="hidden xs:inline">Másolás</span>
                </button>
                <button id="btn-reset" title="Törlés" class="bg-slate-800 hover:bg-rose-950/40 hover:text-rose-400 text-slate-300 text-xs font-medium px-2.5 py-1.5 rounded-lg border border-slate-700 hover:border-rose-900/50 transition flex items-center gap-1.5 active:scale-95">
                    <i class="fa-solid fa-rotate-right text-rose-400"></i>
                    <span class="hidden xs:inline">Nullázás</span>
                </button>
            </div>
        </header>

        <!-- DASHBOARD SUMMARY (Sticky on mobile for easier tracking while scrolling) -->
        <div class="sticky top-2 z-30 bg-slate-950/95 backdrop-blur-md rounded-xl p-2.5 sm:p-3 border border-slate-800 shadow-2xl mb-4">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                
                <!-- 1. Teljes összeg beviteli mező -->
                <div class="bg-slate-900/90 rounded-lg p-2.5 border border-slate-800 flex flex-col justify-between">
                    <div class="flex items-center justify-between mb-1">
                        <label for="target-amount" class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-1">
                            <i class="fa-solid fa-bullseye text-blue-400"></i> Célösszeg
                        </label>
                        <!-- Gyors gombok pillként -->
                        <div class="flex items-center gap-1">
                            <button class="btn-quick-target bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] px-1.5 py-0.5 rounded border border-slate-700 transition" data-add="10000">+10e</button>
                            <button class="btn-quick-target bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] px-1.5 py-0.5 rounded border border-slate-700 transition" data-add="50000">+50e</button>
                        </div>
                    </div>
                    <div class="relative">
                        <input type="number" id="target-amount" placeholder="0" min="0" step="5" inputmode="numeric" pattern="[0-9]*"
                               class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-lg font-bold text-white focus:outline-none focus:border-blue-500 transition pr-9">
                        <span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 font-medium text-xs">Ft</span>
                    </div>
                </div>

                <!-- 2. Eddig beírt (Címletezett) Összeg -->
                <div class="bg-slate-900/90 rounded-lg p-2.5 border border-slate-800 flex items-center justify-between sm:flex-col sm:items-start sm:justify-between">
                    <div>
                        <div class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-1">
                            <i class="fa-solid fa-calculator text-emerald-400"></i> Címletezve
                        </div>
                        <div class="text-xl font-bold text-emerald-400 tracking-tight" id="counted-amount">
                            0 <span class="text-xs font-normal text-slate-400">Ft</span>
                        </div>
                    </div>
                    <div class="text-right sm:text-left text-[11px] text-slate-400">
                        <span>Darab:</span> <span class="font-bold text-slate-200" id="total-piece-count">0 db</span>
                    </div>
                </div>

                <!-- 3. Hátralévő / Különbözet kijelző -->
                <div id="remaining-card" class="bg-slate-900/90 rounded-lg p-2.5 border border-slate-800 flex items-center justify-between transition-all duration-300">
                    <div class="flex-1 pr-2">
                        <div class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-1">
                            <i class="fa-solid fa-scale-balanced text-amber-400"></i> Hátralévő
                        </div>
                        <div class="text-xl font-bold text-amber-400 tracking-tight" id="remaining-amount">
                            0 <span class="text-xs font-normal text-slate-400">Ft</span>
                        </div>
                        <div class="mt-0.5">
                            <span id="status-badge" class="inline-flex items-center gap-1 text-[10px] font-medium text-slate-400">
                                <i class="fa-solid fa-circle-info text-[9px]"></i>
                                <span>Kész</span>
                            </span>
                        </div>
                    </div>

                    <!-- Auto Breakdown Button -->
                    <button id="btn-auto-split" title="Fennmaradó összeg automatikus felosztása"
                            class="bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold text-xs px-2.5 py-2 rounded-lg transition flex items-center gap-1 shadow-md active:scale-95 shrink-0">
                        <i class="fa-solid fa-wand-magic-sparkles text-xs"></i>
                        <span class="text-[11px]">Feloszt</span>
                    </button>
                </div>

            </div>
        </div>

        <!-- MAIN SECTION: DENOMINATIONS -->
        <main class="space-y-4">
            
            <!-- BANKJEGYEK (Banknotes) -->
            <section>
                <div class="flex items-center justify-between mb-2 px-1">
                    <h2 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-money-bill text-emerald-400"></i>
                        <span>Bankjegyek (500 - 20 000 Ft)</span>
                    </h2>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2" id="banknotes-container">
                    <!-- Dynamic Banknote Cards rendered by JS -->
                </div>
            </section>

            <!-- ÉRMÉK (Coins) -->
            <section>
                <div class="flex items-center justify-between mb-2 px-1">
                    <h2 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-coins text-amber-400"></i>
                        <span>Érmék (5 - 200 Ft)</span>
                    </h2>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2" id="coins-container">
                    <!-- Dynamic Coin Cards rendered by JS -->
                </div>
            </section>

        </main>

        <!-- FOOTER -->
        <footer class="mt-8 pt-4 border-t border-slate-800/80 text-center text-[11px] text-slate-500 flex flex-col sm:flex-row items-center justify-between gap-2">
            <p>Magyar Forint (HUF) címletszámoló</p>
            <p class="text-slate-600">&copy; 2026</p>
        </footer>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        
        // Címlet adatok és vizuális beállítások (HUF Bankjegyek és Érmék)
        const DENOMINATIONS = [
            // Bankjegyek
            { value: 20000, type: 'note', color: 'from-emerald-950/40 to-teal-900/20', border: 'border-emerald-500/30', badgeBg: 'bg-emerald-500/20 text-emerald-300', tag: '20.000 Ft', icon: 'fa-money-bill-wave' },
            { value: 10000, type: 'note', color: 'from-purple-950/40 to-indigo-900/20', border: 'border-purple-500/30', badgeBg: 'bg-purple-500/20 text-purple-300', tag: '10.000 Ft', icon: 'fa-money-bill-wave' },
            { value: 5000,  type: 'note', color: 'from-amber-950/40 to-orange-900/20', border: 'border-amber-500/30', badgeBg: 'bg-amber-500/20 text-amber-300', tag: '5.000 Ft', icon: 'fa-money-bill-wave' },
            { value: 2000,  type: 'note', color: 'from-amber-950/30 to-yellow-900/20', border: 'border-yellow-600/30', badgeBg: 'bg-yellow-600/20 text-yellow-300', tag: '2.000 Ft', icon: 'fa-money-bill-wave' },
            { value: 1000,  type: 'note', color: 'from-blue-950/40 to-cyan-900/20', border: 'border-blue-500/30', badgeBg: 'bg-blue-500/20 text-blue-300', tag: '1.000 Ft', icon: 'fa-money-bill-wave' },
            { value: 500,   type: 'note', color: 'from-rose-950/40 to-pink-900/20', border: 'border-rose-500/30', badgeBg: 'bg-rose-500/20 text-rose-300', tag: '500 Ft', icon: 'fa-money-bill-wave' },
            
            // Érmék
            { value: 200,   type: 'coin', color: 'from-slate-900 to-amber-950/30', border: 'border-amber-400/30', badgeBg: 'bg-amber-400/20 text-amber-200', tag: '200 Ft', icon: 'fa-coins' },
            { value: 100,   type: 'coin', color: 'from-slate-900 to-slate-800', border: 'border-slate-500/30', badgeBg: 'bg-slate-400/20 text-slate-200', tag: '100 Ft', icon: 'fa-coins' },
            { value: 50,    type: 'coin', color: 'from-slate-900 to-slate-800', border: 'border-slate-500/30', badgeBg: 'bg-slate-400/20 text-slate-300', tag: '50 Ft', icon: 'fa-coins' },
            { value: 20,    type: 'coin', color: 'from-slate-900 to-amber-950/20', border: 'border-yellow-700/30', badgeBg: 'bg-yellow-700/20 text-yellow-200', tag: '20 Ft', icon: 'fa-coins' },
            { value: 10,    type: 'coin', color: 'from-slate-900 to-slate-800', border: 'border-slate-600/30', badgeBg: 'bg-slate-500/20 text-slate-300', tag: '10 Ft', icon: 'fa-coins' },
            { value: 5,     type: 'coin', color: 'from-slate-900 to-yellow-950/20', border: 'border-amber-700/30', badgeBg: 'bg-amber-700/20 text-amber-300', tag: '5 Ft', icon: 'fa-coins' }
        ];

        // Alkalmazás Állapota (State)
        let counts = {};
        DENOMINATIONS.forEach(d => counts[d.value] = 0);

        // DOM elemek
        const targetAmountInput = document.getElementById('target-amount');
        const countedAmountEl = document.getElementById('counted-amount');
        const remainingAmountEl = document.getElementById('remaining-amount');
        const remainingCardEl = document.getElementById('remaining-card');
        const statusBadgeEl = document.getElementById('status-badge');
        const totalPieceCountEl = document.getElementById('total-piece-count');
        const banknotesContainer = document.getElementById('banknotes-container');
        const coinsContainer = document.getElementById('coins-container');
        const btnAutoSplit = document.getElementById('btn-auto-split');
        const btnReset = document.getElementById('btn-reset');
        const btnCopySummary = document.getElementById('btn-copy-summary');

        // Formázó segédfüggvény (Ezres tagolás Ft-ban)
        function formatFt(val) {
            return new Intl.NumberFormat('hu-HU').format(val);
        }

        // Kártyák dinamikus generálása (Kompakt mobil verzió)
        function renderCards() {
            banknotesContainer.innerHTML = '';
            coinsContainer.innerHTML = '';

            DENOMINATIONS.forEach(denom => {
                const card = document.createElement('div');
                card.className = `bg-gradient-to-br ${denom.color} bg-slate-900 border ${denom.border} rounded-xl p-2.5 shadow flex flex-col justify-between transition-all duration-150`;
                
                card.innerHTML = `
                    <div class="flex items-center justify-between mb-1.5">
                        <div class="flex items-center gap-1.5">
                            <span class="w-6 h-6 rounded-md ${denom.badgeBg} flex items-center justify-center font-bold text-[11px]">
                                <i class="fa-solid ${denom.icon}"></i>
                            </span>
                            <span class="text-sm font-bold text-white tracking-tight">${denom.tag}</span>
                        </div>
                    </div>

                    <!-- Részösszeg kijelző -->
                    <div class="text-[10px] text-slate-400 mb-2 truncate">
                        Részösszeg: <span id="subtotal-${denom.value}" class="font-bold text-slate-200">0 Ft</span>
                    </div>

                    <!-- Léptető és input mező -->
                    <div class="flex items-center gap-1">
                        <!-- Minusz gomb -->
                        <button onclick="adjustQty(${denom.value}, -1)" 
                                class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-200 font-bold flex items-center justify-center border border-slate-700/80 active:scale-90 transition shrink-0">
                            <i class="fa-solid fa-minus text-[10px]"></i>
                        </button>

                        <!-- Input mező numerikus mobilos billentyűzettel -->
                        <div class="relative flex-1 min-w-0">
                            <input type="number" 
                                   id="input-${denom.value}" 
                                   value="${counts[denom.value] || ''}" 
                                   placeholder="0" 
                                   min="0" 
                                   inputmode="numeric"
                                   pattern="[0-9]*"
                                   oninput="updateQtyFromInput(${denom.value}, this.value)"
                                   onfocus="this.select()"
                                   class="w-full text-center bg-slate-950/90 border border-slate-700/80 rounded-lg py-1 px-1 font-bold text-base text-white focus:outline-none focus:border-brand-500 transition">
                        </div>

                        <!-- Plusz gomb -->
                        <button onclick="adjustQty(${denom.value}, 1)" 
                                class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-200 font-bold flex items-center justify-center border border-slate-700/80 active:scale-90 transition shrink-0">
                            <i class="fa-solid fa-plus text-[10px]"></i>
                        </button>
                    </div>

                    <!-- Gyors léptető opciók -->
                    <div class="flex items-center justify-between gap-1 mt-2 pt-1.5 border-t border-slate-800/60 text-[10px]">
                        <button onclick="adjustQty(${denom.value}, 5)" class="flex-1 py-0.5 rounded bg-slate-800/80 hover:bg-slate-700 active:bg-slate-600 text-slate-300 font-medium border border-slate-700/50 transition">+5</button>
                        <button onclick="adjustQty(${denom.value}, 10)" class="flex-1 py-0.5 rounded bg-slate-800/80 hover:bg-slate-700 active:bg-slate-600 text-slate-300 font-medium border border-slate-700/50 transition">+10</button>
                        <button onclick="adjustQty(${denom.value}, 50)" class="flex-1 py-0.5 rounded bg-slate-800/80 hover:bg-slate-700 active:bg-slate-600 text-slate-300 font-medium border border-slate-700/50 transition">+50</button>
                    </div>
                `;

                if (denom.type === 'note') {
                    banknotesContainer.appendChild(card);
                } else {
                    coinsContainer.appendChild(card);
                }
            });
        }

        // Darabszám módosítása gombokkal
        window.adjustQty = function(denomValue, amount) {
            const current = counts[denomValue] || 0;
            const newCount = Math.max(0, current + amount);
            counts[denomValue] = newCount;
            
            const inputEl = document.getElementById(`input-${denomValue}`);
            if (inputEl) {
                inputEl.value = newCount === 0 ? '' : newCount;
            }
            
            recalculateTotal();
        };

        // Darabszám frissítése közvetlen bevitellel
        window.updateQtyFromInput = function(denomValue, rawVal) {
            let parsed = parseInt(rawVal, 10);
            if (isNaN(parsed) || parsed < 0) parsed = 0;
            
            counts[denomValue] = parsed;
            recalculateTotal();
        };

        // Fő számítási logika és UI visszacsatolás
        function recalculateTotal() {
            let totalCounted = 0;
            let totalPieces = 0;

            DENOMINATIONS.forEach(denom => {
                const qty = counts[denom.value] || 0;
                const subtotal = qty * denom.value;
                totalCounted += subtotal;
                totalPieces += qty;

                // Részösszeg frissítése a kártyán
                const subtotalEl = document.getElementById(`subtotal-${denom.value}`);
                if (subtotalEl) {
                    subtotalEl.innerText = `${formatFt(subtotal)} Ft`;
                }
            });

            // Beírt összeg & darabszám kijelzése
            countedAmountEl.innerHTML = `${formatFt(totalCounted)} <span class="text-lg font-normal text-slate-400">Ft</span>`;
            totalPieceCountEl.innerText = `${totalPieces} db`;

            // Célösszeg és hátralévő összeg kezelése
            const targetValStr = targetAmountInput.value;
            const targetVal = parseInt(targetValStr, 10);

            if (isNaN(targetVal) || targetValStr.trim() === '') {
                // Nincs célösszeg megadva
                remainingAmountEl.innerHTML = `${formatFt(0)} <span class="text-lg font-normal text-slate-400">Ft</span>`;
                remainingAmountEl.className = 'text-3xl font-bold text-slate-400 tracking-tight my-2';
                
                statusBadgeEl.className = 'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-slate-800 text-slate-400';
                statusBadgeEl.innerHTML = `<i class="fa-solid fa-circle-info text-xs"></i><span>Nincs megadva célösszeg</span>`;
                
                remainingCardEl.className = 'bg-slate-900/90 rounded-2xl p-5 border border-slate-800 shadow-xl relative overflow-hidden transition-all duration-300';
            } else {
                const diff = targetVal - totalCounted;

                if (diff === 0) {
                    // PONTOS
                    remainingAmountEl.innerHTML = `0 <span class="text-lg font-normal text-emerald-400/80">Ft</span>`;
                    remainingAmountEl.className = 'text-3xl font-bold text-emerald-400 tracking-tight my-2';

                    statusBadgeEl.className = 'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';
                    statusBadgeEl.innerHTML = `<i class="fa-solid fa-circle-check text-xs text-emerald-400"></i><span>Kassza pontos!</span>`;

                    remainingCardEl.className = 'bg-slate-900/90 rounded-2xl p-5 border border-emerald-500/40 shadow-xl shadow-emerald-950/20 relative overflow-hidden transition-all duration-300';
                } else if (diff > 0) {
                    // HÁTRALÉK (Még hiányzik összeg)
                    remainingAmountEl.innerHTML = `${formatFt(diff)} <span class="text-lg font-normal text-amber-400/80">Ft</span>`;
                    remainingAmountEl.className = 'text-3xl font-bold text-amber-400 tracking-tight my-2';

                    statusBadgeEl.className = 'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-amber-500/20 text-amber-300 border border-amber-500/30';
                    statusBadgeEl.innerHTML = `<i class="fa-solid fa-clock-rotate-left text-xs text-amber-400"></i><span>Hiányzó összeg</span>`;

                    remainingCardEl.className = 'bg-slate-900/90 rounded-2xl p-5 border border-amber-500/30 shadow-xl relative overflow-hidden transition-all duration-300';
                } else {
                    // TÖBBLET (Meghaladta a célösszeget)
                    const over = Math.abs(diff);
                    remainingAmountEl.innerHTML = `+${formatFt(over)} <span class="text-lg font-normal text-rose-400/80">Ft</span>`;
                    remainingAmountEl.className = 'text-3xl font-bold text-rose-400 tracking-tight my-2';

                    statusBadgeEl.className = 'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-rose-500/20 text-rose-300 border border-rose-500/30';
                    statusBadgeEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-xs text-rose-400"></i><span>Többlet a célhoz képest!</span>`;

                    remainingCardEl.className = 'bg-slate-900/90 rounded-2xl p-5 border border-rose-500/30 shadow-xl relative overflow-hidden transition-all duration-300';
                }
            }
        }


        // Automatikus felosztás (Greedy algoritmo)
        btnAutoSplit.addEventListener('click', () => {
            const targetValStr = targetAmountInput.value;
            let amountToDivide = parseInt(targetValStr, 10);

            if (isNaN(amountToDivide) || amountToDivide <= 0) {
                showToast('Kérlek, adj meg egy érvényes célösszeget a felosztáshoz!', 'error');
                targetAmountInput.focus();
                return;
            }

            // 5 Ft-os kerekítés ellenőrzés
            if (amountToDivide % 5 !== 0) {
                amountToDivide = Math.round(amountToDivide / 5) * 5;
                targetAmountInput.value = amountToDivide;
                showToast(`Az összeg 5 Ft-ra lett kerekítve (${formatFt(amountToDivide)} Ft)`, 'info');
            }

            // Címletek törlése a felosztás előtt
            DENOMINATIONS.forEach(d => counts[d.value] = 0);

            let tempAmount = amountToDivide;

            // Kapzsi algoritmus (legnagyobbtól a legkisebbig)
            DENOMINATIONS.forEach(denom => {
                if (tempAmount >= denom.value) {
                    const pcs = Math.floor(tempAmount / denom.value);
                    counts[denom.value] = pcs;
                    tempAmount %= denom.value;
                }
            });

            // UI Inputok frissítése
            DENOMINATIONS.forEach(denom => {
                const inputEl = document.getElementById(`input-${denom.value}`);
                if (inputEl) {
                    inputEl.value = counts[denom.value] > 0 ? counts[denom.value] : '';
                }
            });

            recalculateTotal();
            showToast('Sikeres automatikus címletezés!', 'success');
        });

        // Célösszeg mező eseménykezelő
        targetAmountInput.addEventListener('input', recalculateTotal);

        // Gyors célösszeg növelő gombok
        document.querySelectorAll('.btn-quick-target').forEach(btn => {
            btn.addEventListener('click', () => {
                const addVal = parseInt(btn.getAttribute('data-add'), 10);
                const currentVal = parseInt(targetAmountInput.value, 10) || 0;
                targetAmountInput.value = currentVal + addVal;
                recalculateTotal();
            });
        });

        // Nullázás gomb
        btnReset.addEventListener('click', () => {
            targetAmountInput.value = '';
            DENOMINATIONS.forEach(d => {
                counts[d.value] = 0;
                const inputEl = document.getElementById(`input-${d.value}`);
                if (inputEl) inputEl.value = '';
            });
            recalculateTotal();
            showToast('Minden mező törölve.', 'info');
        });


        // Összegzés másolása vágólapra
        btnCopySummary.addEventListener('click', () => {
            let total = 0;
            let totalPcs = 0;
            let lines = ["=== FORINT CÍMLETEZÉSI ÖSSZEGZŐ ==="];
            
            const targetVal = targetAmountInput.value;
            if (targetVal) {
                lines.push(`Célösszeg: ${formatFt(targetVal)} Ft`);
            }

            lines.push("-----------------------------------");
            lines.push("CÍMLETEK:");

            DENOMINATIONS.forEach(d => {
                const qty = counts[d.value] || 0;
                if (qty > 0) {
                    const sub = qty * d.value;
                    total += sub;
                    totalPcs += qty;
                    lines.push(`${d.tag.padEnd(10)}: ${qty} db = ${formatFt(sub)} Ft`);
                }
            });

            lines.push("-----------------------------------");
            lines.push(`ÖSSZESEN: ${formatFt(total)} Ft (${totalPcs} db)`);
            
            if (targetVal) {
                const diff = targetVal - total;
                if (diff === 0) lines.push("KASSZA ÁLLAPOT: PONTOS");
                else if (diff > 0) lines.push(`HIÁNY: ${formatFt(diff)} Ft`);
                else lines.push(`TÖBBLET: ${formatFt(Math.abs(diff))} Ft`);
            }

            const textToCopy = lines.join("\n");

            // Vágólapra másolási kompatibilitás iframe környezetben
            const textarea = document.createElement('textarea');
            textarea.value = textToCopy;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                showToast('Összegzés másolva a vágólapra!', 'success');
            } catch (err) {
                showToast('Sikerestelen másolás!', 'error');
            } finally {
                document.body.removeChild(textarea);
            }
        });

        // Toast Értesítés Megjelenítő
        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.innerText = msg;

            if (type === 'success') {
                toastIcon.className = 'fa-solid fa-circle-check text-emerald-400 text-xl';
            } else if (type === 'error') {
                toastIcon.className = 'fa-solid fa-circle-xmark text-rose-400 text-xl';
            } else {
                toastIcon.className = 'fa-solid fa-circle-info text-blue-400 text-xl';
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Inicializálás az oldal betöltésekor
        window.onload = function() {
            renderCards();
            recalculateTotal();
        };
    </script>
</body>
</html>
